<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Study Buddy — Study notes</title>
  <link rel="stylesheet" href="../lib/pages.css" />
  <link rel="stylesheet" href="notes.css" />
</head>
<body>
  <div class="wrap wide">
    <header class="masthead"><div class="dot"></div><h1>Study notes</h1></header>
    <p class="sub">Everything you saved, plus every passage you highlighted.</p>

    <div class="toolbar">
      <div class="tabs">
        <button class="tab is-on" data-tab="notes" type="button">Notes</button>
        <button class="tab" data-tab="highlights" type="button">Highlights</button>
      </div>
      <input type="text" id="search" placeholder="Search…" />
      <button id="export" type="button">Export Markdown</button>
    </div>

    <div id="list"></div>
    <p class="empty" id="empty" hidden></p>
  </div>
  <script src="../lib/markdown.js"></script>
  <script type="module" src="notes.js"></script>
</body>
</html>
